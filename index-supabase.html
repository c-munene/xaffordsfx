        return el ? el.value : '';
    }
    function getPipMultiplier(pair) {
        if (!pair) return 100000;
        const p = pair.toUpperCase().trim();
        if (['EURUSD','GBPUSD','AUDUSD','NZDUSD','USDCAD','USDCHF'].includes(p)) return 100000;
        if (p.endsWith('JPY')) return 1000;
        if (p === 'XAUUSD' || p === 'GOLD') return 100;
        if (p === 'XAGUSD') return 5000;
        if (['BTCUSD','ETHUSD','US30','NASDAQ','SPX500','GER40'].includes(p)) return 1;
        if (p.includes('OIL')) return 1000;
        return 100000;
    }

async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.add('hidden');

    if (!email || !password) { errEl.textContent = 'Please enter email and password'; errEl.classList.remove('hidden'); return; }

    showLoading('Signing in...');
    try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await afterAuth(data.user);
    } catch (e) {
        hideLoading();
        let msg = e.message || 'Login failed';
        if (msg.toLowerCase().includes('email not confirmed')) {
            msg = 'Please confirm your email first. Check your inbox (and spam folder) for the confirmation link.';
        } else if (msg.toLowerCase().includes('invalid login') || msg.toLowerCase().includes('invalid credentials')) {
            msg = 'Invalid email or password.';
        }
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
    }
}

    async function afterAuth(user) {
        currentUser = user;
        const { data: profile } = await supabase.from('profiles').select('username').eq('id', user.id).single();
        const displayName = profile?.username || user.user_metadata?.username || user.email?.split('@')[0] || 'Trader';

        document.getElementById('current-username').textContent = displayName;
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');

        await loadAccounts();
        hideLoading();
        navigate(0);
    }

    async function logout() {
        if (!confirm('Sign out?')) return;
        await supabase.auth.signOut();
        currentUser = null;
        accounts = [];
        currentAccountId = null;
        document.getElementById('main-app').classList.add('hidden');
        document.getElementById('auth-container').classList.remove('hidden');
        showLogin();
    }

    function showLogin() {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('signup-form').classList.add('hidden');
    }
    function showSignup() {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('signup-form').classList.remove('hidden');
    }
    function updatePasswordStrength() {
        const password = document.getElementById('signup-password').value;
        const bar = document.getElementById('strength-bar');
        const text = document.getElementById('password-strength-text');
        let strength = 0;
        if (password.length >= 8) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;
        const colors = ['bg-red-500','bg-red-500','bg-yellow-500','bg-emerald-500','bg-emerald-500'];
        const labels = ['Very Weak','Weak','Medium','Strong','Very Strong'];
        bar.style.width = (strength / 4 * 100) + '%';
        bar.className = 'strength-bar ' + colors[strength];
        text.textContent = labels[strength];
    }

        }

        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
            showLoading('Restoring session...');
            await afterAuth(session.user);
        } else {
            showLogin();
        }

        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                currentUser = null;
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('auth-container').classList.remove('hidden');
            }
        });
